global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "auth-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["auth-service:8000", "host.docker.internal:8001"]

  - job_name: "feedback-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["feedback-service:8000", "host.docker.internal:8002"]

  - job_name: "notification-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["notification-service:8000", "host.docker.internal:8006"]

  - job_name: "menu-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["menu-service:8000"]

  - job_name: "order-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["order-service:8000"]

  - job_name: "payment-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["payment-service:8000"]

