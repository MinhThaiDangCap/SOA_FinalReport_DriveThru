map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # DNS nội bộ của Docker: nginx vẫn khởi động được dù một service chưa lên
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;

    # Chặn đường nội bộ giữa các service
    location /internal/ { return 404; }
    location = /metrics { return 404; }

    location ^~ /api/auth     { set $up http://auth-service:8000;     proxy_pass $up; }
    location ^~ /api/menu     { set $up http://menu-service:8000;     proxy_pass $up; }
    location ^~ /api/orders   { set $up http://order-service:8000;    proxy_pass $up; }
    location ^~ /api/payments { set $up http://payment-service:8000;  proxy_pass $up; }
    location ^~ /api/reviews  { set $up http://feedback-service:8000; proxy_pass $up; }

    # React Router: mọi đường dẫn khác trả về index.html
    # (cần cho /payment/result và F5 trên các trang con)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html không được lưu đệm: build lại gateway là trình duyệt lấy giao diện mới ngay,
    # không cần Ctrl+F5. File JS/CSS trong /assets có mã băm trong tên nên lưu đệm lâu được.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}